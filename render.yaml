# Render Blueprint for BrandTrace
# Free tier web service running full-stack React + Express + SQLite
# Note: On Render free tier, the filesystem is ephemeral, so the SQLite database is reset
# whenever the container restarts or spins down after inactivity.
services:
  - type: web
    name: brandtrace-app
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: BRANDTRACE_DB
        value: /tmp/brandtrace.db
      - key: STORAGE_MODE
        value: ephemeral
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_MODEL
        value: gemini-3.8-flash
      - key: LLM_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai/
      # Set GEMINI_API_KEY in the Render dashboard (never in Git). Key: https://aistudio.google.com/apikey
      - key: GEMINI_API_KEY
        sync: false
      # Caps AI calls per hour across all visitors (resets on restart) so judges cannot exhaust your free quota.
      - key: LLM_MAX_CALLS_PER_HOUR
        value: "30"
      # Google's free tier allows about 20 requests/day per model, so cap per day as well (0 = unlimited).
      - key: LLM_MAX_CALLS_PER_DAY
        value: "15"
      # Optional: lets you change AI settings via the x-admin-token header. Unset = settings are read-only.
      - key: ADMIN_TOKEN
        sync: false
      # Exact frontend origins allowed if hosted separately (comma-separated, no wildcards)
      - key: CORS_ORIGINS
        value: ""

